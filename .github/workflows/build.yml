name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK (ANDROID_HOME is set).
      - name: Build both APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleBikeDebug assembleLinkDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: RideDash-old-phone-apk
          path: app/build/outputs/apk/bike/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RideDash-Link-main-phone-apk
          path: app/build/outputs/apk/link/debug/*.apk
